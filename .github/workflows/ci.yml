name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify TypeCheck, Lint, Tests & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript TypeCheck
        run: npx tsc --noEmit

      - name: ESLint Code Quality
        run: npm run lint

      - name: Run Unit Tests
        run: npx tsx --test src/services/__tests__/*.test.ts

      - name: Expo Web Build Export
        run: npx expo export --platform web
